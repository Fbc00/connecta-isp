services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Credenciais do super_admin criadas no primeiro boot (defina em produção)
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@connecta.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-connecta-admin}
      # Provider de mensagens: mock (default) | resend | sendgrid | twilio
      MESSAGE_PROVIDER: ${MESSAGE_PROVIDER:-mock}
      # URL pública base para links de NPS
      APP_URL: ${APP_URL:-http://localhost:8080}
    ports:
      - "8080:3000"
    volumes:
      - sqlite:/app/.data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/api/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  sqlite:
